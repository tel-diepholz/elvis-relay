# Cloud-Relay der ELVIS-App. Einrichten: siehe README.
name = "elvis-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# Erreichbar unter https://relay.einsatzleitwagen.app; die alte workers.dev-Adresse bleibt für ältere Installationen an
workers_dev = true

# Relay und WKD (Web Key Directory) der ELW-Postfächer als Custom Domains (Zone im selben Konto)
routes = [
  { pattern = "relay.einsatzleitwagen.app", custom_domain = true },
  { pattern = "openpgpkey.einsatzleitwagen.app", custom_domain = true },
]

[vars]
MAIL_DOMAIN = "einsatzleitwagen.app"
RELAY_URL = "https://relay.einsatzleitwagen.app"
# "manual": Postfächer nach der Bestätigung erst nach Freigabe durch den Betreiber aktiv (siehe README)
MAIL_APPROVAL = ""
# Betreiber-Adresse für Statusalarme (leer = keine)
STATUS_ALERT_EMAIL = ""
# Kontingent je Backup-Tresor (Vorgabe; je Tresor in backup_vaults überschreibbar)
BACKUP_MAX_COUNT = "30"
BACKUP_MAX_BYTES = "2147483648"
# Secret (nicht hier): npx wrangler secret put STATUS_ADMIN_TOKEN

[[d1_databases]]
binding = "DB"
database_name = "elvis-relay"
database_id = "1c15b913-764b-441e-870c-b0b6061c3a83"
migrations_dir = "migrations"

# Verschlüsselte Mails bis zur Abholung durch den ELW
[[r2_buckets]]
binding = "MAIL"
bucket_name = "elvis-mail"

# Verschlüsselte Backups der ELVIS-Installationen (Tresor je Wiederherstellungsschlüssel)
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "elvis-backups"

# Versand (Cloudflare Email Sending für einsatzleitwagen.app)
[[send_email]]
name = "MAILER"

# Stündlich aufräumen (Positionen nach 24 h, verwaiste Geräte nach 90 Tagen, Mail) und stündlich Statusprüfung
# (die Testmail zählt gegen das Tageskontingent für den Versand – nicht öfter)
[triggers]
crons = ["17 * * * *", "0 * * * *"]
